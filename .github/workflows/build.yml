name: Build S82 Jam

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: ASIO SDK (GPLv3 option, Steinberg 2025)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.steinberg.net/asiosdk" -OutFile asiosdk.zip
          Expand-Archive asiosdk.zip -DestinationPath asiotmp
          $common = Get-ChildItem asiotmp -Recurse -Directory -Filter common | Select-Object -First 1
          New-Item -ItemType Directory -Force ..\asiosdk | Out-Null
          Copy-Item -Recurse $common.FullName ..\asiosdk\common
          Get-ChildItem ..\asiosdk\common | Select-Object -First 5

      - name: Configure
        run: cmake -A x64 -B build

      - name: Build
        run: cmake --build build --config Release --target SonoBus_Standalone -j 4

      - name: Package
        shell: pwsh
        run: |
          $exe = Get-ChildItem build -Recurse -Filter "S82 Jam.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe.FullName "dist\S82 Jam.exe"
          Copy-Item LICENSE dist\LICENSE.txt
          Compress-Archive -Path dist\* -DestinationPath S82-Jam-Windows.zip

      - uses: actions/upload-artifact@v5
        with:
          name: S82-Jam-Windows
          path: S82-Jam-Windows.zip

  mac:
    runs-on: macos-latest
    env:
      # old JUCE uses APIs removed when targeting macOS 15+; juceaide reads this too
      MACOSX_DEPLOYMENT_TARGET: "10.13"
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure
        run: |
          set -o pipefail
          cmake -G Xcode -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee cfg.log || {
            msg=$(grep -iE -B2 -A8 "error" cfg.log | tail -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=mac configure::$msg"; exit 1; }

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --config Release --target SonoBus_Standalone -- -quiet 2>&1 | tee build.log || {
            msg=$(grep -E "error:|\*\* BUILD FAILED" build.log | head -30 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=mac build::$msg"; exit 1; }

      - name: Package
        run: |
          APP=$(find build -name "S82 Jam.app" -type d | head -1)
          codesign --force --deep -s - "$APP"
          mkdir -p dmg && cp -R "$APP" dmg/ && cp LICENSE dmg/LICENSE.txt
          ln -s /Applications dmg/Applications
          hdiutil create -volname "S82 Jam" -srcfolder dmg -ov -format UDZO S82-Jam-Mac.dmg

      - uses: actions/upload-artifact@v5
        with:
          name: S82-Jam-Mac
          path: S82-Jam-Mac.dmg

  server:
    # proves server/setup-server.sh's build step works on a fresh Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Build aooserver (same commands as server/setup-server.sh)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q build-essential git pkg-config libcurl4-openssl-dev
          git clone -q https://github.com/essej/aooserver.git src
          git -C src checkout -q 81a4cf94cfc0b25a7efa8fdbb4d53a0ecf00f10b
          make -C src/Builds/LinuxMakefile CONFIG=Release -j4 2>&1 | tail -5
          ./src/Builds/LinuxMakefile/build/aooserver -h

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: S82 Jam ${{ github.ref_name }}
          body: |
            Windows: tải S82-Jam-Windows.zip, giải nén, chạy "S82 Jam.exe" (cảnh báo SmartScreen: More info → Run anyway).
            Mac: tải S82-Jam-Mac.dmg, kéo S82 Jam vào Applications. Lần đầu mở: System Settings → Privacy & Security → Open Anyway.
          files: |
            S82-Jam-Windows/S82-Jam-Windows.zip
            S82-Jam-Mac/S82-Jam-Mac.dmg
